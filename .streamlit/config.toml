[theme]
primaryColor = "#0f5c6e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2fafb"
textColor = "#0b3d4a"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
# Smaller payloads help free-tier Cloud apps
maxMessageSize = 50

[browser]
gatherUsageStats = false

[runner]
# Faster interactive updates where supported
fastReruns = true
